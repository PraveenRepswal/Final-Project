<!-- Auth Modal -->
<div class="auth-modal-overlay" id="authModalOverlay">
    <div class="auth-modal">
        <button class="auth-modal-close" id="authModalClose">&times;</button>
        <h1 id="authFormTitle">Sign In</h1>
        <div id="authErrorMsg" class="error"></div>
        <form id="authModalForm">
            <div class="form-group" id="authNameGroup" style="display: none;">
                <label for="authName">Name</label>
                <input type="text" id="authName" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="authUsername">Username</label>
                <input type="text" id="authUsername" required>
            </div>
            <div class="form-group">
                <label for="authPassword">Password</label>
                <input type="password" id="authPassword" required>
            </div>
            <button type="submit" class="btn" id="authSubmitBtn">Sign In</button>
        </form>
        <div class="toggle-mode">
            <span id="authToggleText">Don't have an account? </span>
            <a id="authToggleBtn">Register</a>
        </div>
    </div>
</div>
<script id="authModalScript">
document.addEventListener('DOMContentLoaded', () => {
    const overlay = document.getElementById('authModalOverlay');
    const closeBtn = document.getElementById('authModalClose');
    let isLogin = true;
    const formTitle = document.getElementById('authFormTitle');
    const submitBtn = document.getElementById('authSubmitBtn');
    const toggleText = document.getElementById('authToggleText');
    const toggleBtn = document.getElementById('authToggleBtn');
    const errorMsg = document.getElementById('authErrorMsg');

    function openModal() { overlay.style.display = 'flex'; }
    function closeModal() { overlay.style.display = 'none'; errorMsg.style.display = 'none'; }
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

    toggleBtn.addEventListener('click', () => {
        isLogin = !isLogin;
        if (isLogin) {
            formTitle.innerText = "Sign In"; submitBtn.innerText = "Sign In";
            toggleText.innerText = "Don't have an account? "; toggleBtn.innerText = "Register";
            document.getElementById('authNameGroup').style.display = 'none';
        } else {
            formTitle.innerText = "Register"; submitBtn.innerText = "Create Account";
            toggleText.innerText = "Already have an account? "; toggleBtn.innerText = "Sign In";
            document.getElementById('authNameGroup').style.display = 'block';
        }
        errorMsg.style.display = 'none';
    });

    document.getElementById('authModalForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        const name = document.getElementById('authName') ? document.getElementById('authName').value : undefined;
        const username = document.getElementById('authUsername').value;
        const password = document.getElementById('authPassword').value;

        try {
            if (isLogin) {
                const formData = new URLSearchParams(); formData.append('username', username); formData.append('password', password);
                const res = await fetch('/api/v1/auth/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData });
                if (!res.ok) throw new Error("Invalid username or password");
                const data = await res.json();
                localStorage.setItem("userToken", data.access_token); localStorage.setItem("username", username);
                closeModal(); window.location.reload();
            } else {
                const payload = name ? { name, username, password } : { username, password };
                const res = await fetch('/api/v1/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) { const errorData = await res.json(); throw new Error(errorData.detail || "Registration failed"); }
                alert("Registration successful! Please sign in."); toggleBtn.click();
            }
        } catch (err) { errorMsg.innerText = err.message; errorMsg.style.display = 'block'; }
    });

    const signinBtns = document.querySelectorAll('button');
    signinBtns.forEach(btn => {
        const span = btn.querySelector('.truncate');
        if (span && (span.innerText.includes('Sign In') || span.innerText.includes('Sign Out'))) {
            const token = localStorage.getItem('userToken');
            const user = localStorage.getItem('username');
            if (token) {
                span.innerText = `Sign Out (${user})`;
                btn.onclick = (e) => { e.preventDefault(); localStorage.removeItem('userToken'); localStorage.removeItem('username'); window.location.reload(); };
            } else {
                span.innerText = `Sign In`;
                btn.onclick = (e) => { e.preventDefault(); openModal(); };
            }
        }
    });
});
</script>
